spring:
  datasource:
    url: jdbc:h2:mem:smarthome_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: BINARY
  flyway:
    enabled: true

app:
  security:
    jwt-ttl-seconds: 900
  cors:
    allowed-origin: http://localhost:8443