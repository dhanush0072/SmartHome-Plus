spring:
  application:
    name: smarthome-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smarthome_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: BINARY
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-ttl-seconds: ${JWT_TTL_SECONDS:900}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:8443}